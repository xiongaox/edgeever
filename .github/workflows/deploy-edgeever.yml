name: Deploy EdgeEver

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeever-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy EdgeEver
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EDGE_EVER_WORKER_NAME: edgeever
      EDGE_EVER_WORKERS_DEV: "true"
      EDGE_EVER_D1_DATABASE_NAME: edgeever
      EDGE_EVER_D1_DATABASE_ID: ${{ vars.EDGE_EVER_D1_DATABASE_ID }}
      EDGE_EVER_R2_BUCKET_NAME: ${{ vars.EDGE_EVER_R2_BUCKET_NAME }}
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: ${{ vars.EDGE_EVER_R2_PREVIEW_BUCKET_NAME }}
      EDGE_EVER_AUTH_USERNAME: xiongaox
      EDGE_EVER_AUTH_PASSWORD: ${{ secrets.EDGE_EVER_AUTH_PASSWORD }}
      EDGE_EVER_DEPLOYMENT_TRIGGER: github_actions
      EDGE_EVER_DEPLOYMENT_METHOD: github_actions

    steps:
      - name: Checkout production source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build EdgeEver
        run: bun run build:cloudflare

      - name: Migrate, deploy, and verify
        run: bun run deploy:ci
